[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-map"
version = "0.1.0"
description = "Ensemble maps for intrinsically disordered regions from all-atom and coarse-grained simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Feng Yu" },
    { name = "Shahar Sukenik" },
]
keywords = [
    "intrinsically disordered proteins",
    "IDR",
    "molecular dynamics",
    "contact map",
    "protein design",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# Declared for reference. Installing from here will not work on Windows, because mdtraj
# publishes no wheels for 1.9.x; create the environment from environment.yml first and
# then `pip install -e . --no-deps`.
dependencies = [
    "mdtraj==1.9.9",
    "numpy==1.23.5",
    "pandas==1.5.3",
    "scipy==1.9.3",
    "matplotlib==3.6.3",
]

[project.urls]
Repository = "https://github.com/smallfishabc/EnsembleMap"
Issues = "https://github.com/smallfishabc/EnsembleMap/issues"

[project.optional-dependencies]
test = ["pytest==7.4.4"]

[project.scripts]
ensemble-map = "ensemble_map.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
